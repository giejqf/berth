# Built-in: Linear through linear-cli (MIT; github.com/nesszer/linear-cli).
# bin/linear-cli is fetched by scripts/fetch-connectors.sh (`just fetch-connectors`).
name = "linear"
title = "Linear"
description = "open issues, yours and unassigned, as workflow origins"
binary = "bin/linear-cli"
secrets = ["LINEAR_API_KEY"]

[origin]
kind = "linear"
# Open issues in your teams that are assigned to you or to no one, the 250
# most recently updated. The GraphQL aliases produce Berth's item shape
# directly: ref, title, body, url. One request: `--paginate` would walk a
# whole backlog 50 at a time.
list = [
    "api", "query", "--quiet", "--compact",
    'query { issues(first: 250, orderBy: updatedAt, filter: { state: { type: { nin: ["completed", "canceled"] } }, team: { members: { some: { isMe: { eq: true } } } }, assignee: { or: [{ isMe: { eq: true } }, { null: true }] } }) { nodes { ref: identifier title body: description url } } }',
]
items = "data.issues.nodes"
