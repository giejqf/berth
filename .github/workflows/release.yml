name: Release

# Builds the drag-to-install disk images (scripts/dmg.sh), one per CPU:
# every run uploads them as artifacts; a v* tag also drafts a GitHub release
# with them attached, to review and publish by hand. With the signing secrets
# the images are signed with Berth's Developer ID and notarized; a tag needs
# them (AGENTS.md §12.1).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # Apple silicon
          - runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sidecar/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sidecar/pnpm-lock.yaml
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "berth-app") | .version')
          test "v$version" = "$GITHUB_REF_NAME" ||
            { echo "tag $GITHUB_REF_NAME does not match berth-app $version"; exit 1; }
      - name: Signing identity and notary key
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            if [[ $GITHUB_REF == refs/tags/* ]]; then
              echo "::error::a release needs the signing secrets (MACOS_CERTIFICATE, NOTARY_API_KEY, …)"
              exit 1
            fi
            echo "no signing secrets: the image is signed ad hoc"
            exit 0
          fi
          # A keychain of its own, the default for this run, so codesign and
          # notarytool find the identity and the profile without prompting.
          kc="$RUNNER_TEMP/berth-signing.keychain-db"
          pw=$(openssl rand -hex 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | xargs)
          security default-keychain -d user -s "$kc"
          printf %s "$MACOS_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          # Apple's Developer ID intermediate, which the chain needs.
          curl -fsSL -o "$RUNNER_TEMP/devid-g2.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/devid-g2.cer" |
            shasum -a 256 -c
          security import "$RUNNER_TEMP/devid-g2.cer" -k "$kc"
          printf %s "$NOTARY_API_KEY" | base64 --decode >"$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials berth-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER" --keychain "$kc"
          rm "$RUNNER_TEMP/notary.p8"
          security find-identity -v -p codesigning "$kc"
          {
            echo "BERTH_SIGN_IDENTITY=Developer ID Application"
            echo "BERTH_NOTARY_PROFILE=berth-notary"
          } >>"$GITHUB_ENV"
      - run: scripts/dmg.sh
      - name: Check the image
        run: |
          dmg=$(ls dist/Berth-*.dmg)
          hdiutil verify "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt"' EXIT
          test -L "$mnt/Applications"
          codesign --verify --strict "$mnt/Berth.app"
          test -f "$mnt/Berth.app/Contents/Resources/Berth.icns"
          # Nothing of Anthropic's in the image: the app downloads it (ADR 0029).
          sidecar="$mnt/Berth.app/Contents/Resources/sidecar"
          test -f "$sidecar/claude-agent-sdk.json"
          test ! -e "$sidecar/claude"
          if grep -q CLAUDE_AGENT_SDK_VERSION "$sidecar/sidecar.mjs"; then
            echo "the Claude Agent SDK is bundled into sidecar.mjs"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.runner }}
          path: dist/Berth-*.dmg
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/berth-signing.keychain-db" 2>/dev/null || true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release drafted by hand, with its own notes, gets these images
          # in place of any it was given.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Berth-*.dmg --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          cat >notes.md <<'NOTES'
          Open the disk image for your Mac (`arm64` for Apple silicon, `x86_64` for Intel)
          and drag Berth into Applications.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/Berth-*.dmg \
            --repo "$GITHUB_REPOSITORY" --draft --title "Berth ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --generate-notes
