[package]
name = "berth-svg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Build tooling: renders Berth's SVG artwork (app icon, DMG background) to PNG"

[dependencies]
anyhow.workspace = true
# Text in the app's bundled fonts only (no system fonts), so a render is the
# same on every machine. No raster images.
resvg = { version = "0.46", default-features = false, features = ["text"] }

[lints]
workspace = true
