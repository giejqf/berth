<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 30 440 560" width="440" height="560">
  <title>Berth</title>
  <!-- The Berth mark: five strands braid together over an open ring with
       three marks inside it. Strands are 28 wide, 50.5 apart; a strand
       that passes under another stops 5 short of it. The ring is an outer
       and a deeper inner band, 40 each, round (270, 375). Coordinates follow
       the 538×602 artwork it was drawn from. -->
  <defs>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="225" x2="0" y2="275">
      <stop offset="0" stop-color="#1496f2"/>
      <stop offset="1" stop-color="#1677c2"/>
    </linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x1="0" y1="49" x2="0" y2="380">
      <stop offset="0" stop-color="#28c4da"/>
      <stop offset="0.65" stop-color="#22b8d8"/>
      <stop offset="1" stop-color="#2780cb"/>
    </linearGradient>
    <linearGradient id="e" gradientUnits="userSpaceOnUse" x1="0" y1="225" x2="0" y2="275">
      <stop offset="0" stop-color="#2aedd5"/>
      <stop offset="1" stop-color="#1aa9b0"/>
    </linearGradient>
    <linearGradient id="leg" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="380">
      <stop offset="0" stop-color="#1a6fae"/>
      <stop offset="0.3" stop-color="#2a8de8"/>
      <stop offset="1" stop-color="#6c6bd2"/>
    </linearGradient>
    <linearGradient id="stem" gradientUnits="userSpaceOnUse" x1="0" y1="292" x2="0" y2="393">
      <stop offset="0" stop-color="#1982a2"/>
      <stop offset="0.35" stop-color="#1da6c2"/>
      <stop offset="1" stop-color="#2091b8"/>
    </linearGradient>
    <linearGradient id="arm" gradientUnits="userSpaceOnUse" x1="0" y1="295" x2="0" y2="335">
      <stop offset="0" stop-color="#0f62ab"/>
      <stop offset="1" stop-color="#1673bf"/>
    </linearGradient>
    <linearGradient id="bar-b" gradientUnits="userSpaceOnUse" x1="0" y1="45" x2="0" y2="182">
      <stop offset="0" stop-color="#26d0ee"/>
      <stop offset="1" stop-color="#1ea8f2"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="0" y1="255" x2="0" y2="585">
      <stop offset="0" stop-color="#5c41bc"/>
      <stop offset="0.136" stop-color="#7444b8"/>
      <stop offset="0.409" stop-color="#ad4fa2"/>
      <stop offset="0.561" stop-color="#c55e8c"/>
      <stop offset="0.712" stop-color="#de7277"/>
      <stop offset="0.833" stop-color="#e98961"/>
      <stop offset="0.939" stop-color="#f49749"/>
      <stop offset="1" stop-color="#fba14b"/>
    </linearGradient>
    <linearGradient id="ring-in" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="525">
      <stop offset="0" stop-color="#432a87"/>
      <stop offset="0.441" stop-color="#733991"/>
      <stop offset="0.596" stop-color="#994c92"/>
      <stop offset="0.739" stop-color="#bb587e"/>
      <stop offset="0.890" stop-color="#c6666f"/>
      <stop offset="1" stop-color="#d1735f"/>
    </linearGradient>
    <linearGradient id="warm" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c49b0"/>
      <stop offset="1" stop-color="#ee8253"/>
    </linearGradient>
    <linearGradient id="cool" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25c6d4"/>
      <stop offset="1" stop-color="#3a72db"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a45c1"/>
      <stop offset="0.5" stop-color="#c05991"/>
      <stop offset="1" stop-color="#f09656"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round">
    <!-- The open ring: an outer band and a deeper inner one. -->
    <path d="M117.7 261.5A190 190 0 1 0 422.3 261.5" stroke="url(#ring)" stroke-width="40"/>
    <path d="M149.7 285.4A150 150 0 1 0 390.3 285.4" stroke="url(#ring-in)" stroke-width="40"/>
    <!-- The two hollow strands, each with its level. -->
    <rect x="208.5" y="38" width="22" height="176" rx="11" fill="#2a86d6" fill-opacity="0.22" stroke="#2a86d6" stroke-opacity="0.5" stroke-width="6"/>
    <rect x="309.5" y="38" width="22" height="176" rx="11" fill="#2fd6c6" fill-opacity="0.16" stroke="#2fd6c6" stroke-opacity="0.42" stroke-width="6"/>
    <path d="M219.5 51V176" stroke="url(#bar-b)" stroke-width="12"/>
    <path d="M320.5 51V127" stroke="#31e4d2" stroke-width="12"/>
  </g>
  <g fill="none" stroke-width="28">
    <!-- The outer strands bend in and pass under the legs. -->
    <path d="M169 49V215C169 234.7 178.1 248.6 200.8 267.8" stroke="url(#a)"/>
    <path d="M371 49V215C371 234.7 361.9 248.6 339.2 267.8" stroke="url(#e)"/>
    <!-- The left leg comes out from under the middle strand. -->
    <path d="M257 251.5C237.6 267.9 203.5 278.5 203.5 305V366" stroke="url(#leg)"/>
    <!-- The middle strand becomes the right leg. -->
    <path d="M270 49V228C270 262 336.5 268 336.5 305V366" stroke="url(#mid)" stroke-linecap="round"/>
    <!-- The Y: its left arm and its stem, from under the legs. -->
    <path d="M232 298.1C242 307.4 252 317.5 262 330" stroke="url(#arm)" stroke-width="24"/>
    <path d="M300.2 292.2C281.3 305.7 270 320.2 270 346V379" stroke="url(#stem)"/>
  </g>
  <!-- Round ends where a strand doesn't pass under another. -->
  <circle cx="169" cy="49" r="14" fill="#1496f2"/>
  <circle cx="371" cy="49" r="14" fill="#2aedd5"/>
  <circle cx="203.5" cy="366" r="14" fill="#6c6bd2"/>
  <circle cx="270" cy="379" r="14" fill="#2091b8"/>
  <!-- Dots and the three marks in the ring. -->
  <circle cx="221.5" cy="240" r="6.5" fill="#2ad3e7"/>
  <circle cx="161" cy="379" r="8" fill="#8878eb"/>
  <circle cx="379" cy="379" r="8" fill="#26d9da"/>
  <circle cx="203.5" cy="415" r="21.5" fill="url(#warm)"/>
  <circle cx="336.5" cy="415" r="21.5" fill="url(#cool)"/>
  <rect x="252" y="407" width="36" height="71" rx="18" fill="url(#drop)"/>
</svg>
