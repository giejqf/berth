[package]
name = "berth-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Berth: the GPUI app"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
berth-connectors.workspace = true
berth-core.workspace = true
berth-gh.workspace = true
berth-git.workspace = true
berth-protocol.workspace = true
berth-sidecar-client.workspace = true
berth-slot.workspace = true

alacritty_terminal.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

gpui.workspace = true
gpui_platform.workspace = true
gpui-component = { workspace = true, features = ["tree-sitter-languages"] }
gpui-base.workspace = true
gpui-kit-assets = "=0.7.3"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
# Scripted UI autopilot + window screenshots for development (see src/devtools.rs).
devtools = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
